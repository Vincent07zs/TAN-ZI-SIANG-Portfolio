<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tan Zi Siang — Portfolio</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#F3EFE4}
.hero{position:relative;width:100%;height:100vh;height:100dvh;overflow:hidden;background:#F3EFE4;isolation:isolate;touch-action:none;
  font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;color:#1d1a10;-webkit-user-select:none;user-select:none}
#bg{position:absolute;inset:0;width:100%;height:100%;display:block}
.portrait{position:absolute;bottom:0;left:50%;transform:translateX(-50%);aspect-ratio:1024/1536;width:min(64vh,92vw)}
.portrait img,.portrait canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.portrait img{object-fit:fill;pointer-events:none}
#ghost{opacity:.022;-webkit-mask-image:radial-gradient(ellipse 30% 24% at 50% 31%,#000 35%,transparent 100%);
  mask-image:radial-gradient(ellipse 30% 24% at 50% 31%,#000 35%,transparent 100%)}
.pad{--fs:clamp(60px,10.5vw,160px);--t:calc(env(safe-area-inset-top,0px) + clamp(18px,3vw,40px));--s:clamp(18px,3vw,44px)}
.mark{position:absolute;top:var(--t);left:var(--s);margin:0;mix-blend-mode:difference;color:#F6F6F2;pointer-events:none;
  font-family:"HelveticaNeue-CondensedBlack","HelveticaNeue-CondensedBold","AvenirNextCondensed-Heavy","Arial Narrow",Impact,sans-serif;
  font-weight:900;font-size:var(--fs);line-height:.8;letter-spacing:-.015em;text-transform:uppercase}
.mark span{display:block}
.cap{position:absolute;left:var(--s);top:calc(var(--t) + var(--fs)*1.7);margin:0;font-size:13px;letter-spacing:.01em;max-width:22ch;line-height:1.35;color:#4a4332}
.cta{position:absolute;top:var(--t);right:var(--s);padding:12px 22px;border-radius:999px;background:#B4E600;color:#14120a;
  font-weight:600;font-size:14px;text-decoration:none;transition:transform .2s}
.cta:hover{transform:scale(1.05)}
.cta:focus-visible{outline:2px solid #14120a;outline-offset:3px}
.card{position:absolute;left:var(--s);bottom:calc(env(safe-area-inset-bottom,0px) + clamp(18px,3vw,40px));max-width:230px;padding:14px 16px;
  border-radius:14px;background:rgba(243,239,228,.86);font-size:13px;line-height:1.4;pointer-events:none}
.card b{display:flex;align-items:center;gap:8px;font-weight:600;margin-bottom:4px}
.card i{width:8px;height:8px;border-radius:50%;background:#B4E600;display:block}
.card p{margin:0;color:#4a4332}
@media (max-width:768px){
  .portrait{width:min(58vh,118vw)}
  .pad{--fs:clamp(56px,19vw,110px)}
  .cta{padding:10px 18px;font-size:13px}
}
</style>
</head>
<body>
<main class="hero pad" id="hero">
  <canvas id="bg"></canvas>
  <div class="portrait" id="portrait">
    <img id="base" alt="Portrait of the site owner, casual">
    <img id="ghost" alt="" aria-hidden="true">
    <canvas id="brush"></canvas>
  </div>
  <h1 class="mark" aria-label="Tan Zi Siang"><span>Tan</span><span>Zi Siang</span></h1>
  <p class="cap">Designer &amp; creative developer</p>

  <a class="cta" href="#">Let’s Talk</a>
  <div class="card"><b><i></i>Open for projects</b><p>Booking brand, web and motion work from January.</p></div>
</main>

const $=id=>document.getElementById(id);
const hero=$("hero"),por=$("portrait"),bgc=$("bg"),brc=$("brush"),ghost=$("ghost");
$("base").src=A;ghost.src=B;
const hidden=new Image();hidden.src=B;
const bg=bgc.getContext("2d"),br=brc.getContext("2d");
const imp=document.createElement("canvas"),ic=imp.getContext("2d");
const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;
const touchMode=matchMedia("(hover: none)").matches;
const LIFE=1350,HOLD=.26,TAU=Math.PI*2;
let vw=0,vh=0,dpr=1,rect={left:0,top:0,width:1,height:1};
let dabs=[],lx=null,ly=null,carry=0,lastSpawn=0,px=-1e4,py=-1e4,realInside=false,virtActive=false,ps=0,lastBg=0;
let takeover=0;const t0=performance.now();

function resize(){
  vw=hero.clientWidth;vh=hero.clientHeight;dpr=Math.min(window.devicePixelRatio||1,2);
  bgc.width=Math.round(vw*dpr);bgc.height=Math.round(vh*dpr);
  imp.width=Math.round(vw/2);imp.height=Math.round(vh/2);
  const r=por.getBoundingClientRect();rect={left:r.left,top:r.top,width:r.width,height:r.height};
  brc.width=Math.round(r.width*dpr);brc.height=Math.round(r.height*dpr);
  drawBg(performance.now());renderBrush(performance.now());
}

/* ---------- dabs ---------- */
function life(d,now){
  const a=(now-d.t)/LIFE;if(a>=1)return null;if(a<HOLD)return[1,1];
  const u=(a-HOLD)/(1-HOLD),s=u*u*(3-2*u);return[1-s,1-.42*s];
}
function dabPath(c,d,sc,now){
  const n=24,P=[],cr=Math.cos(d.rot),sr=Math.sin(d.rot);
  for(let i=0;i<n;i++){
    const th=i/n*TAU;
    const r=1+.155*Math.sin(2*th+d.p+now*.0009)+.085*Math.sin(3*th+d.p*1.7-now*.0007)+.04*Math.sin(5*th+d.p*2.3+now*.0011);
    const x=d.rx*sc*r*Math.cos(th),y=d.ry*sc*r*Math.sin(th);
    P.push([d.x+x*cr-y*sr,d.y+x*sr+y*cr]);
  }
  c.beginPath();
  c.moveTo((P[n-1][0]+P[0][0])/2,(P[n-1][1]+P[0][1])/2);
  for(let i=0;i<n;i++){const q=P[(i+1)%n];c.quadraticCurveTo(P[i][0],P[i][1],(P[i][0]+q[0])/2,(P[i][1]+q[1])/2)}
  c.closePath();
}
function spawn(x,y,now){
  const pw=rect.width,k=Math.random()<.4?2:1;
  for(let i=0;i<k;i++){
    dabs.push({x:x+(Math.random()-.5)*.03*pw,y:y+(Math.random()-.5)*.03*pw,
      rx:pw*(.17+Math.random()*.13),ry:pw*(.021+Math.random()*.026),
      rot:(Math.random()-.5)*.5,p:Math.random()*TAU,t:now});
  }
  if(dabs.length>56)dabs.splice(0,dabs.length-56);
  lastSpawn=now;
}
function move(x,y,now){
  px=x;py=y;
  if(lx===null){spawn(x,y,now);lx=x;ly=y;carry=0;return}
  const th=.028*rect.width,dx=x-lx,dy=y-ly,d=Math.hypot(dx,dy);if(!d)return;
  let s=th-carry;
  while(s<=d){spawn(lx+dx*s/d,ly+dy*s/d,now);s+=th}
  carry=d-(s-th);lx=x;ly=y;
}

/* ---------- brush (portrait reveal) ---------- */
function renderBrush(now){
  dabs=dabs.filter(d=>life(d,now));
  br.setTransform(1,0,0,1,0,0);br.clearRect(0,0,brc.width,brc.height);
  if(!dabs.length||!hidden.complete||!hidden.naturalWidth)return;
  br.setTransform(dpr,0,0,dpr,-rect.left*dpr,-rect.top*dpr);
  br.fillStyle="#000";
  for(const d of dabs){const l=life(d,now);br.globalAlpha=l[0];dabPath(br,d,l[1],now);br.fill()}
  br.globalAlpha=1;br.globalCompositeOperation="source-in";
  br.setTransform(dpr,0,0,dpr,0,0);
  br.drawImage(hidden,0,0,rect.width,rect.height);
  br.globalCompositeOperation="source-over";
}

/* ---------- background ---------- */
const CL=[{x:.14,y:.78,r0:.07,sp:.075,s:1},{x:.86,y:.2,r0:.06,sp:.08,s:2.3},{x:.7,y:.94,r0:.05,sp:.07,s:4.1}];
const RINGS=8,SEG=96;
function drawBg(now){
  const t=reduced?0:(now-t0)/1000;
  bg.setTransform(dpr,0,0,dpr,0,0);bg.clearRect(0,0,vw,vh);
  // imprint: saturating mask, composited once
  ic.setTransform(1,0,0,1,0,0);ic.clearRect(0,0,imp.width,imp.height);
  if(dabs.length){
    ic.setTransform(.5,0,0,.5,0,0);ic.fillStyle="#3B3320";
    for(const d of dabs){const l=life(d,now);if(!l)continue;ic.globalAlpha=l[0];dabPath(ic,d,l[1],now);ic.fill()}
    ic.globalAlpha=1;
    bg.globalAlpha=.15;bg.drawImage(imp,0,0,vw,vh);bg.globalAlpha=1;
  }
  const m=Math.min(vw,vh),reach=.23*m*ps,core=reach*.32;
  const N=new Path2D,W=new Path2D,L=new Path2D;
  CL.forEach((c,ci)=>{
    const cx=(c.x+Math.sin(t*.045+c.s)*.02)*vw,cy=(c.y+Math.cos(t*.038+c.s*1.7)*.02)*vh,sp=c.sp*m;
    for(let i=0;i<RINGS;i++){
      const R=c.r0*m+i*sp,A=Math.min(.4*sp,.3*R);
      const p1=c.s+i*.7+t*.18,p2=c.s*1.3+i*.9-t*.13,p3=c.s*.7+i*.5+t*.11;
      let fx=0,fy=0,ox=0,oy=0;
      for(let j=0;j<=SEG;j++){
        const th=(j%SEG)/SEG*TAU;
        const rad=R+A*(.5*Math.sin(2*th+p1)+.3*Math.sin(3*th+p2)+.2*Math.sin(4*th+p3));
        let x=cx+rad*Math.cos(th),y=cy+rad*Math.sin(th),dist=1e9;
        if(reach>1){
          const dx=x-px,dy=y-py;dist=Math.hypot(dx,dy);
          if(dist<reach&&dist>.01){const f=1-dist/reach,k=22*ps*f*f*(3-2*f)/dist;x+=dx*k;y+=dy*k}
        }
        if(j>0){
          const P=dist<core?L:dist<reach?W:N;
          P.moveTo(ox,oy);P.lineTo(x,y);
        }
        ox=x;oy=y;
      }
    }
  });
  bg.lineWidth=1.25;bg.lineCap="round";
  bg.strokeStyle="#D3CCBB";bg.stroke(N);
  bg.strokeStyle="#FBFAF4";bg.stroke(W);
  bg.strokeStyle="#B4E600";bg.stroke(L);
  lastBg=now;
}

/* ---------- virtual cursor (intro sweep + touch loop) ---------- */
const SW0=t0+900,SWD=2800;
function virtual(now){
  if(touchMode){
    if(now<takeover||realInside)return null;
    const a=now/1000;
    return{x:rect.left+rect.width*(.5+.36*Math.sin(a*.7)),y:rect.top+rect.height*(.42+.22*Math.sin(a*1.1+1))};
  }
  if(realInside||now<SW0||now>SW0+SWD)return null;
  const u=(now-SW0)/SWD,e=u*u*(3-2*u);
  return{x:rect.left+rect.width*(.1+.8*e),y:rect.top+rect.height*(.3+.2*Math.sin(e*Math.PI*1.4))};
}

/* ---------- pointer ---------- */
hero.addEventListener("pointermove",e=>{
  const now=performance.now();
  if(e.pointerType==="touch")takeover=now+2500;
  realInside=true;move(e.clientX,e.clientY,now);
  renderBrush(now);drawBg(now);
});
hero.addEventListener("pointerdown",e=>{
  const now=performance.now();
  if(e.pointerType==="touch")takeover=now+2500;
  realInside=true;lx=null;move(e.clientX,e.clientY,now);renderBrush(now);drawBg(now);
});
const leave=e=>{realInside=false;lx=null;if(e&&e.pointerType==="touch")takeover=performance.now()+2500};
document.documentElement.addEventListener("pointerleave",leave);
hero.addEventListener("pointerup",e=>{if(e.pointerType==="touch")leave(e)});
hero.addEventListener("pointercancel",leave);

/* ---------- main loop ---------- */
function frame(now){
  const vp=virtual(now);
  if(vp){if(!virtActive)lx=null;virtActive=true;move(vp.x,vp.y,now)}
  else{if(virtActive)lx=null;virtActive=false}
  const inside=realInside||virtActive;
  if(inside&&now-lastSpawn>130)spawn(px,py,now);
  ps+=((inside?1:0)-ps)*.12;if(ps<.002)ps=0;
  renderBrush(now);
  if(now-lastBg>32&&(!reduced||dabs.length||ps>0))drawBg(now);
  requestAnimationFrame(frame);
}

/* ---------- resting flicker ---------- */
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function flicker(){
  while(true){
    await sleep(2200+Math.random()*4200);
    const n=1+Math.floor(Math.random()*3);
    for(let k=0;k<n;k++){
      ghost.style.opacity=(.07+Math.random()*.05).toFixed(3);
      await sleep(70+Math.random()*25);
      ghost.style.opacity=.022;
      if(k<n-1)await sleep(60+Math.random()*110);
    }
  }
}

resize();
addEventListener("resize",resize);
hidden.onload=()=>renderBrush(performance.now());
requestAnimationFrame(frame);
if(!reduced)flicker();
})();
</script>
